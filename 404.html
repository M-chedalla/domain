<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost in space | Chedalla</title>
    <!-- GitHub Pages serves this file for any URL that doesn't exist.
         Paths are absolute (/...) because it can be shown at any depth. -->
    <meta name="robots" content="noindex">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚩</text></svg>">
    <style>
        :root {
            --neon-color: #0ef;
            --hanuman-saffron: #FF9933;
            --bg: #050505;
            --muted: #888;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            text-align: center;
        }

        /* Two layers of tiny stars drawn with gradients, drifting slowly. */
        .stars {
            position: fixed;
            inset: -50%;
            z-index: 0;
            background-image:
                radial-gradient(1px 1px at 20px 30px, #fff, transparent),
                radial-gradient(1px 1px at 90px 120px, #fff, transparent),
                radial-gradient(1.5px 1.5px at 160px 60px, #cff, transparent),
                radial-gradient(1px 1px at 230px 180px, #fff, transparent),
                radial-gradient(1px 1px at 300px 90px, #fff, transparent);
            background-size: 320px 220px;
            opacity: 0.6;
            animation: drift 120s linear infinite;
        }
        .stars--far {
            background-size: 180px 140px;
            opacity: 0.3;
            animation-duration: 200s;
        }
        @keyframes drift { to { transform: translate(320px, 220px); } }

        .lost {
            position: relative;
            z-index: 1;
            padding: 0 16px;
            max-width: 32rem;
        }

        .lost__hanuman {
            width: min(260px, 60vw);
            height: auto;
            filter: drop-shadow(0 0 18px rgba(255, 153, 51, 0.45));
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-4deg); }
            50%      { transform: translateY(-14px) rotate(3deg); }
        }

        .lost__code {
            margin: 24px 0 8px;
            font-size: clamp(56px, 14vw, 96px);
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--neon-color);
            text-shadow: 0 0 12px var(--neon-color), 0 0 32px rgba(0, 238, 255, 0.4);
        }

        .lost__text {
            margin: 0 0 32px;
            font-size: 18px;
            line-height: 1.5;
            color: #ccc;
        }
        .lost__text span { color: var(--muted); font-size: 15px; }

        .lost__home {
            display: inline-block;
            padding: 12px 28px;
            border: 1px solid var(--neon-color);
            border-radius: 999px;
            color: var(--neon-color);
            text-decoration: none;
            font-size: 16px;
            letter-spacing: 0.04em;
            transition: background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
        }
        .lost__home:hover,
        .lost__home:focus-visible {
            background-color: var(--neon-color);
            color: var(--bg);
            box-shadow: 0 0 20px var(--neon-color);
        }
        .lost__home:focus-visible {
            outline: 2px solid var(--hanuman-saffron);
            outline-offset: 4px;
        }

        @media (prefers-reduced-motion: reduce) {
            .stars, .lost__hanuman { animation: none; }
        }
    </style>
</head>
<body>
    <div class="stars" aria-hidden="true"></div>
    <div class="stars stars--far" aria-hidden="true"></div>

    <main class="lost">
        <img class="lost__hanuman" src="/images/hanuman.webp" alt="" width="400" height="199">
        <h1 class="lost__code">404</h1>
        <p class="lost__text">
            This page leapt off somewhere.<br>
            <span>Even Hanuman couldn't find it.</span>
        </p>
        <a class="lost__home" href="/">Back to chedalla.in</a>
    </main>
</body>
</html>
