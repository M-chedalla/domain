    <style>
        :root {
            --star-speed: 100s;
            --ticker-speed: 40s; 
            --neon-color: #0ef; /* Default Cyan */
            --hanuman-saffron: #FF9933; /* Divine Saffron */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #fff;
            height: 100vh;
            height: 100dvh; /* avoids the jump when mobile browser bars show/hide */
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.2s ease;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- Cyberpunk Tab Toggle --- */
        .cyber-toggle {
            position: fixed;
            top: 30px;
            right: 30px;
            display: flex;
            align-items: center;
            gap: 15px; 
            z-index: 1000;
            cursor: pointer;
        }

        .cyber-opt {
            /* reset native <button> styling so it looks like the old text toggle */
            background: none;
            border: 0;
            margin: 0;
            cursor: pointer;
            font-family: 'Sree Krushnadevaraya', serif;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.3); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            padding: 5px; 
        }

        .cyber-opt.opt-te { font-size: 18px; margin-top: -2px; }

        .cyber-line {
            width: 2px;
            height: 24px;
            background-color: var(--neon-color);
            box-shadow: 0 0 10px var(--neon-color), 0 0 20px var(--neon-color);
            border-radius: 2px;
            transform: skew(-10deg); 
            transition: background-color 0.5s ease, box-shadow 0.5s ease;
        }

        .cyber-opt.active {
            color: #fff;
            transform: scale(1.2);
            text-shadow: 0 0 8px rgba(255,255,255,0.5);
            font-weight: 600;
        }

        .cyber-toggle:hover .cyber-opt:not(.active) { color: rgba(255, 255, 255, 0.7); }

        /* Visible keyboard focus for every interactive element */
        .cyber-opt:focus-visible,
        .social-icon:focus-visible {
            outline: 2px solid var(--neon-color);
            outline-offset: 6px;
            border-radius: 6px;
        }
        .cyber-opt:focus-visible { outline-offset: 2px; }

        .visually-hidden {
            position: absolute !important;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* --- Social Icons --- */
        .social-icons-container {
            display: flex;
            gap: 40px; 
            z-index: 10; 
        }

        .social-icon {
            display: inline-flex;
            color: #fff;
            text-decoration: none;
            transition: transform 0.3s ease, color 0.3s ease, filter 0.3s ease;
            position: relative;
        }

        .social-icon svg {
            width: 2.5rem;
            height: 2.5rem;
            display: block;
        }

        .social-icon:hover,
        .social-icon:focus-visible {
            transform: scale(1.2);
            color: var(--neon-color); 
            filter: drop-shadow(0 0 10px var(--neon-color)) drop-shadow(0 0 20px var(--neon-color));
        }

        /* --- Background Layers --- */
        .stars-container, .nebula {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transition: opacity 1s ease; 
        }

        .stars-container { z-index: 0; }
        .nebula { z-index: -1; background: radial-gradient(circle at 50% 50%, rgba(20, 20, 40, 0.4), transparent 80%); }

        /* The star layers are 1000px taller than the screen and drift by moving
           (transform) rather than repainting background-position every frame.
           That keeps the drift on the GPU, so warp speed doesn't steal frames
           from the flying Hanuman. 1000px is a multiple of every tile size
           (50/100/200px), so the loop is seamless. */
        .stars, .stars2, .stars3 {
            position: absolute;
            top: -1000px;
            left: 0;
            width: 100%;
            height: calc(100% + 1000px);
            display: block;
            background: transparent; 
            will-change: transform;
        }

        .stars { background-image: radial-gradient(white 1px, transparent 1.5px); background-size: 50px 50px; opacity: 0.3; animation: space-drift var(--star-speed) linear infinite; }
        .stars2 { background-image: radial-gradient(white 1.5px, transparent 2px); background-size: 100px 100px; background-position: 20px 30px; opacity: 0.5; animation: space-drift calc(var(--star-speed) * 0.8) linear infinite; }
        .stars3 { background-image: radial-gradient(#fff 2px, transparent 3px); background-size: 200px 200px; background-position: 50px 80px; opacity: 0.8; animation: space-drift calc(var(--star-speed) * 0.6) linear infinite, twinkle 4s ease-in-out infinite; }

        /* --- Matrix Rain Canvas --- */
        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0; 
            opacity: 0;  
            transition: opacity 2s ease;
            pointer-events: none;
            filter: blur(0.75px); /* soft-focus rain so the name stays the hero */
        }

        /* --- Scribble Trail Canvas --- */
        #scribbleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            z-index: 1; 
        }

        /* --- Falling Star Styling --- */
        .falling-star {
            position: fixed;
            height: 2px;
            background: linear-gradient(45deg, rgba(255,255,255,1), transparent);
            border-radius: 999px;
            filter: drop-shadow(0 0 6px rgba(255,255,255,1));
            z-index: 1; 
            pointer-events: none;
            opacity: 0;
            transform: rotate(-45deg);
            transition: opacity 0.5s ease;
        }

        @keyframes shoot {
            0% { transform: translate(0, 0) rotate(-45deg); opacity: 1; }
            100% { transform: translate(-300px, 300px) rotate(-45deg); opacity: 0; }
        }

        /* --- FLYING HANUMAN IMAGE --- */
        .ufo-container {
            position: fixed;
            left: -300px; 
            z-index: 5;
            width: 180px; 
            height: auto;
            /* Saffron Glow for Hanuman Energy */
            filter: drop-shadow(0 0 20px var(--hanuman-saffron)); 
            pointer-events: none;
            transition: opacity 0.5s ease;
            will-change: transform; /* own GPU layer, so it glides smoothly */
        }
        
        .ufo-fly-anim { animation: ufo-fly linear forwards; }
        
        @keyframes ufo-fly {
            0% { transform: translateX(0) translateY(100px) scale(0.8); }
            50% { transform: translateX(50vw) translateY(0px) scale(0.65); }
            100% { transform: translateX(calc(100vw + 300px)) translateY(-100px) scale(0.5); }
        }

        /* --- Animations --- */
        @keyframes space-drift {
            0% { transform: translateY(0); }
            100% { transform: translateY(1000px); }
        }

        /* --- WARP SPEED STATE --- */
        body.warp-active { background-color: #000510; }
        body.warp-active .stars, body.warp-active .stars2, body.warp-active .stars3 {
            animation-duration: 0.2s; opacity: 0.6; scale: 1 2; /* no blur filter here: blurring these huge layers every frame made Hanuman stutter */ 
        }
        
        /* Hanuman steps out of frame while warp is held (the streaking stars
           made him look jittery) and glides back in on release. */
        body.warp-active .ufo-container { opacity: 0; transition-duration: 0.25s; }

        /* --- SUDARSHANA CHAKRA CURSOR --- */
        /* The native cursor is only hidden on mouse/trackpad devices, and it
           comes back over links and buttons so it's always clear what is
           clickable. The chakra keeps following the pointer everywhere. */
        @media (hover: hover) and (pointer: fine) {
            body.has-pointer { cursor: none; }
            body.has-pointer a,
            body.has-pointer button { cursor: pointer; }
        }

        .cursor-star {
            position: fixed;
            top: 0;
            left: 0;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            /* Dashed border looks like a spinning chakra */
            border: 2px dashed #ffffff; 
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5); 
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            will-change: left, top, transform;
            animation: spin 4s linear infinite; /* Slow normal spin */
            transition: width 0.2s, height 0.2s, border-color 0.3s, opacity 0.3s;
            opacity: 0; /* hidden until the pointer first moves */
        }

        body.has-pointer .cursor-star { opacity: 1; }

        @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }

        /* Warp Mode: Fast Spin + Glow */
        body.warp-active .cursor-star {
            width: 50px;
            height: 50px;
            border-color: var(--neon-color);
            box-shadow: 0 0 20px var(--neon-color), inset 0 0 10px var(--neon-color);
            animation: spin 0.3s linear infinite; /* Furious spin */
        }

        /* --- SPARKS EFFECT (Restored) --- */
        .cursor-star::before,
        .cursor-star::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            /* Uses the neon-color variable, so it will be Saffron in Maya mode */
            border: 3px dotted var(--neon-color); 
            transform: translate(-50%, -50%) scale(0.5);
            opacity: 0;
            pointer-events: none;
            filter: blur(1px);
            transition: border-color 0.3s ease;
        }

        /* Trigger Spark Animations on Warp Active */
        body.warp-active .cursor-star::before {
            animation: spark-burst-1 0.4s ease-out infinite;
        }

        body.warp-active .cursor-star::after {
            animation: spark-burst-2 0.4s ease-out infinite 0.2s; 
        }

        @keyframes spark-burst-1 {
            0% { transform: translate(-50%, -50%) scale(0.8) rotate(0deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2.2) rotate(180deg); opacity: 0; }
        }

        @keyframes spark-burst-2 {
            0% { transform: translate(-50%, -50%) scale(0.8) rotate(90deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2.5) rotate(270deg); opacity: 0; }
        }


        /* --- NAKSHATRA SKY ---
           27 lunar mansions drawn from real star positions, in order from
           Ashwini to Revati: 14 above the name, 13 below it. */
        .nak-sky {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            transition: opacity 1s ease;
        }
        .nak {
            position: absolute;
            padding: 0;
            margin: 0;
            border: 0;
            background: none;
            cursor: pointer;
            pointer-events: auto;
            color: rgba(255, 255, 255, 0.85);
            border-radius: 12px;
        }
        .nak svg { display: block; overflow: visible; }
        .nak .lines { stroke: rgba(255, 255, 255, 0.16); stroke-width: 1; fill: none; transition: stroke 0.25s ease; }
        .nak .star { fill: currentColor; transition: fill 0.25s ease; }
        .nak .ring { fill: none; stroke: rgba(255, 255, 255, 0.14); stroke-dasharray: 2 4; }
        .nak:hover .lines, .nak:focus-visible .lines, .nak.is-open .lines { stroke: var(--neon-color); stroke-width: 1.3; }
        .nak:hover .star, .nak:focus-visible .star, .nak.is-open .star { fill: #fff; filter: drop-shadow(0 0 4px var(--neon-color)); }
        .nak:focus-visible { outline: 2px solid var(--neon-color); outline-offset: 6px; }
        /* Tonight's Moon is in this one */
        .nak.is-today .lines { stroke: var(--hanuman-saffron); stroke-opacity: 0.8; }
        .nak.is-today .star { fill: #ffd9a8; animation: today-glow 3s ease-in-out infinite; }
        @keyframes today-glow { 50% { filter: drop-shadow(0 0 6px var(--hanuman-saffron)); } }

        .nak-tip {
            position: absolute;
            z-index: 3;
            min-width: 150px;
            max-width: 220px;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(8, 10, 22, 0.94);
            border: 1px solid var(--neon-color);
            color: #cfd2e0;
            font-size: 13px;
            line-height: 1.45;
            pointer-events: none;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
        }
        .nak-tip .te { display: block; font-size: 22px; color: #fff; line-height: 1.3; }
        .nak-tip .en { display: block; color: #fff; font-weight: 600; }
        .nak-tip .num { font-size: 11px; letter-spacing: 0.08em; color: #8a8ea3; text-transform: uppercase; }
        .nak-tip .today { display: block; margin-top: 4px; color: var(--hanuman-saffron); }

        /* --- PANCHANGAM BADGE --- */
        .panch {
            position: fixed;
            left: max(24px, env(safe-area-inset-left, 0px));
            top: calc(24px + env(safe-area-inset-top, 0px));
            z-index: 1000;
            font-size: 13px;
        }
        .panch-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px 8px 10px;
            border-radius: 999px;
            border: 1px solid rgba(255, 153, 51, 0.45);
            background: rgba(8, 8, 16, 0.82);
            color: #fff;
            font: inherit;
            text-align: left;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }
        .panch-badge:hover { border-color: var(--hanuman-saffron); }
        .panch-badge:focus-visible { outline: 2px solid var(--neon-color); outline-offset: 3px; }
        .panch-badge svg { flex: none; }
        .panch-line1 { display: block; font-weight: 600; font-size: 14px; }
        .panch-line2 { display: block; color: #a9adbf; font-size: 12px; }
        .panch-panel {
            position: absolute;
            left: 0;
            top: calc(100% + 10px);
            width: min(320px, calc(100vw - 32px));
            box-sizing: border-box;
            padding: 16px 18px;
            border-radius: 14px;
            background: rgba(8, 10, 22, 0.96);
            border: 1px solid rgba(255, 153, 51, 0.45);
            color: #cfd2e0;
            line-height: 1.45;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        .panch-panel h2 { margin: 0 0 10px; font-size: 15px; color: #fff; }
        .panch-panel dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; }
        .panch-panel dt { color: #8a8ea3; }
        .panch-panel dd { margin: 0; color: #fff; }
        .panch-panel dd small { display: block; color: #a9adbf; font-size: 12px; }
        .panch-panel .panch-note { margin: 12px 0 0; font-size: 11.5px; color: #8a8ea3; }
        .panch-panel button {
            margin-top: 10px;
            font: inherit;
            font-size: 12.5px;
            color: #fff;
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 999px;
            padding: 5px 12px;
            cursor: pointer;
        }
        .panch-panel button:focus-visible { outline: 2px solid var(--neon-color); outline-offset: 2px; }

            background: radial-gradient(circle, rgba(255, 214, 150, 0.85) 0%, rgba(255, 153, 51, 0.55) 18%, rgba(255, 120, 20, 0.18) 40%, transparent 62%);
            animation: mantra-glow 1.6s ease-out forwards;
        }
        @keyframes mantra-glow {
            0% { transform: scale(0.05); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }
        .mantra-spark {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 6px;
            height: 6px;
            margin: -3px 0 0 -3px;
            border-radius: 50%;
            background: #ffd9a8;
            box-shadow: 0 0 10px 3px var(--hanuman-saffron);
            animation: mantra-spark 1.4s ease-out forwards;
        }
        @keyframes mantra-spark {
            0% { transform: rotate(var(--a)) translateX(0); opacity: 1; }
            100% { transform: rotate(var(--a)) translateX(var(--d)); opacity: 0; }
        }
        .mantra-words {
            position: absolute;
            left: 50%;
            top: 24%; /* above the name, so both stay readable */
            transform: translate(-50%, -50%);
            font-family: 'Sree Krushnadevaraya', serif;
            font-size: clamp(32px, 7vw, 84px);
            color: #fff;
            text-shadow: 0 0 18px var(--hanuman-saffron), 0 0 40px var(--hanuman-saffron);
            white-space: nowrap;
            animation: mantra-words 2.2s ease-out forwards;
        }
        @keyframes mantra-words {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            25% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            75% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* --- Main Content Area --- */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            z-index: 10; 
            position: relative;

            pointer-events: none;
        }
        .main-content a { pointer-events: auto; }

        .ticker-wrap {
            width: 100%;
            height: 16vw; 
            overflow: hidden;
            white-space: nowrap;
            display: flex;
            align-items: center; 
        }

        .ticker-move {
            display: flex;
            animation: ticker-seamless var(--ticker-speed) linear infinite;
        }

        .ticker-item {
            flex-shrink: 0;
            font-family: 'Playfair Display', serif;
            font-size: 10vw;

            text-shadow: 0 0 10px rgba(0,0,0,0.5);
            font-weight: 600;
            letter-spacing: -1px;
            -webkit-user-select: none;
            user-select: none;
        }

        @keyframes ticker-seamless {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .footer-container {
            width: 100%;
            padding-bottom: 20px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .beaming-line {
            height: 1px;
            width: 100%;
            background: linear-gradient(90deg, transparent, #fff, transparent);
            background-size: 50% 100%;
            background-repeat: no-repeat;
            opacity: 0.7;
            animation: beam 3s infinite linear;
            margin-bottom: 15px;
        }

        @keyframes beam {
            0% { background-position: -50% 0; }
            100% { background-position: 150% 0; }

        .footer-text { color: #888; font-size: 14px; }
        .copyright-year { font-family: 'Major Mono Display', monospace; font-weight: bold; letter-spacing: 1px; margin-right: 8px; }
        .signature-text { font-family: 'Sirivennela', sans-serif; font-size: 18px; }

            .panch-line2 { display: none; }

        /* --- Reduced motion: keep the look, drop the movement --- */
        @media (prefers-reduced-motion: reduce) {
            .stars, .stars2, .stars3,
            .beaming-line,
            .cursor-star,
            .cursor-star::before,

                animation: none !important;
            }
            .falling-star, .ufo-container { display: none; }
            .nak.is-today .star { animation: none; }
            /* Mantra: a soft saffron glow that fades, no burst or sparks */
            .mantra-glow { animation: mantra-fade 2s ease-in-out forwards; transform: none; }
            .mantra-spark { display: none; }
            .mantra-words { animation: mantra-fade 2.4s ease-in-out forwards; }

            /* Show the name once, centred, instead of scrolling */
            .ticker-wrap { height: auto; white-space: normal; justify-content: center; }
            .ticker-move { animation: none; width: 100%; justify-content: center; }
            .ticker-item { flex-shrink: 1; padding: 20px; white-space: normal; text-align: center; font-size: 8vw; }
            .ticker-item + .ticker-item { display: none; }

            body.warp-active .stars, body.warp-active .stars2, body.warp-active .stars3 { scale: none; }
        }

        @keyframes mantra-fade { 0%, 100% { opacity: 0; } 40%, 60% { opacity: 0.8; } }

        /* Windows High Contrast etc.: use the system cursor */
        @media (forced-colors: active) {
            body.has-pointer { cursor: auto; }

    <script>
        const root = document.documentElement; 
        let isMayaMode = false; 
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        const matrixCanvas = document.getElementById('matrixCanvas');
        
        // --- 0. Language Toggle Logic ---
        const btnEn = document.getElementById('btnEn');
        const btnTe = document.getElementById('btnTe');
        const mainTexts = document.querySelectorAll('.main-text'); 
        const footerSignature = document.getElementById('footerSignature');
        const tickerMove = document.querySelector('.ticker-move');
        const srName = document.getElementById('srName');
        
        const enName = "Mani Krishna Chandra Teja Chedalla";
        const teName = "మణి కృష్ణ చంద్ర తేజ చెదళ్ళ";
        
        const enFont = "'Playfair Display', serif"; 
        const teFont = "'Sirivennela', sans-serif"; 

        function markActive(activeBtn, otherBtn) {
            activeBtn.classList.add('active');
            activeBtn.setAttribute('aria-pressed', 'true');
            otherBtn.classList.remove('active');
            otherBtn.setAttribute('aria-pressed', 'false');
        }

        function setEnglish() {
            markActive(btnEn, btnTe);
            tickerMove.lang = 'en';
            srName.lang = 'en';
            srName.textContent = enName;
            footerSignature.lang = 'te';

            mainTexts.forEach(el => {
                el.innerText = enName;
                el.style.fontFamily = enFont;
            });
            footerSignature.innerText = teName;
            footerSignature.style.fontFamily = teFont;
            footerSignature.style.fontSize = "25px"; 
            
            root.style.setProperty('--ticker-speed', '40s');
            exitMayaMode();
            if (window.Chedalla) Chedalla.setLang('en');
        }

        function setTelugu() {
            markActive(btnTe, btnEn);
            tickerMove.lang = 'te';
            srName.lang = 'te';
            srName.textContent = teName;
            footerSignature.lang = 'en';

            mainTexts.forEach(el => {
                el.innerText = teName;
                el.style.fontFamily = teFont;
            });
            footerSignature.innerText = enName;
            footerSignature.style.fontFamily = enFont;
            footerSignature.style.fontSize = "16px"; 

            root.style.setProperty('--ticker-speed', '30s'); 
            enterMayaMode();
            if (window.Chedalla) Chedalla.setLang('te');
        }

        // 'click' covers mouse, touch, and keyboard (Enter / Space)
        btnEn.addEventListener('click', setEnglish);
        btnTe.addEventListener('click', setTelugu);

        // --- 2. Canvas Setup ---
        const cursorStar = document.getElementById('cursorStar');
        const nebula = document.getElementById('nebulaLayer');
        const canvas = document.getElementById('scribbleCanvas');
        const ctx = canvas.getContext('2d');
        
        let currentTrailColor = '#0ef';
        let width = window.innerWidth;
        let height = window.innerHeight;

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            
            matrixCanvas.width = width;
            matrixCanvas.height = height;
            if (isMayaMode) initMatrix(); // new column count for the new width
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        // --- 3. Pointer Tracking ---
        let mouseX = width / 2;
        let mouseY = height / 2;
        let lastX = mouseX;
        let lastY = mouseY;
        let warpTimer;

        function updatePointer(x, y) {
            mouseX = x;
            mouseY = y;
            cursorStar.style.left = x + 'px';
            cursorStar.style.top = y + 'px';
            
            const moveX = (x * -0.01);
            const moveY = (y * -0.01);
            nebula.style.transform = `translate(${moveX}px, ${moveY}px)`;
            wakeScribble();
        }

        document.addEventListener('mousemove', (e) => {
            // Only hide the native cursor once we know the chakra is showing
            document.body.classList.add('has-pointer');
            updatePointer(e.clientX, e.clientY);
        });
        document.documentElement.addEventListener('mouseleave', () => {
            document.body.classList.remove('has-pointer');
        });
        document.addEventListener('mousedown', (e) => {
            // No warp when clicking a control (toggle, badge, nakshatra, links)
            if(e.target.closest('.cyber-toggle, .panch, .nak, a, button')) return; 
            document.body.classList.add('warp-active');
        });
        document.addEventListener('mouseup', () => document.body.classList.remove('warp-active'));

        // Is the page pinch-zoomed in? Then let the browser pan normally.
        function isZoomed() {
            return window.visualViewport && window.visualViewport.scale > 1.01;
        }

        document.addEventListener('touchstart', (e) => {
            if(e.target.closest('.cyber-toggle, .panch, .nak')) return;
            if (e.touches.length > 1) { clearTimeout(warpTimer); return; } // pinch
            const touch = e.touches[0];
            lastX = touch.clientX;
            lastY = touch.clientY;
            updatePointer(touch.clientX, touch.clientY);
            warpTimer = setTimeout(() => {
                document.body.classList.add('warp-active');
            }, 800);
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            clearTimeout(warpTimer);
            document.body.classList.remove('warp-active'); 
            // Leave pinch-zoom and zoomed-in panning to the browser
            if (e.touches.length > 1 || isZoomed()) return;
            if (e.cancelable) e.preventDefault();
            const touch = e.touches[0];
            updatePointer(touch.clientX, touch.clientY);
        }, { passive: false });

        document.addEventListener('touchend', () => {
            clearTimeout(warpTimer);
            document.body.classList.remove('warp-active');
        });

        // --- 4. Render Scribble Loop ---
        // Only runs while the pointer is moving or the trail is still fading,
        // so an idle page isn't redrawing a full-screen canvas 60 times a second.
        const FADE_FRAMES = 60; // 0.9^60 ≈ 0.2% left, i.e. fully faded
        let scribbleRunning = false;
        let idleFrames = 0;

        function wakeScribble() {
            idleFrames = 0;
            if (!scribbleRunning) {
                scribbleRunning = true;
                requestAnimationFrame(renderScribble);
            }
        }

        function renderScribble() {
            ctx.save();
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)'; 
            ctx.fillRect(0, 0, width, height);
            ctx.restore();

            if (lastX !== mouseX || lastY !== mouseY) {
                ctx.beginPath();
                ctx.strokeStyle = currentTrailColor; 
                ctx.lineWidth = 2;
                ctx.shadowBlur = 10;
                ctx.shadowColor = currentTrailColor;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(mouseX, mouseY);
                ctx.stroke();

                lastX = mouseX;
                lastY = mouseY;
                idleFrames = 0;
            } else {
                idleFrames++;
            }

            if (idleFrames > FADE_FRAMES) {
                ctx.clearRect(0, 0, width, height);
                scribbleRunning = false;
                return;
            }
            requestAnimationFrame(renderScribble);
        }


        // --- 5. FLYING HANUMAN Logic ---
        const ufo = document.getElementById('ufo');

        function triggerUFO() {
            if(isMayaMode || reducedMotion.matches) { setTimeout(triggerUFO, 15000); return; }

            // Random starting height
            const randomTop = Math.floor(Math.random() * 60) + 20; 
            const randomDuration = Math.random() * 5 + 8; 

            ufo.style.top = randomTop + '%';
            ufo.style.animationDuration = randomDuration + 's';
            
            ufo.classList.remove('ufo-fly-anim');
            void ufo.offsetWidth; 
            ufo.classList.add('ufo-fly-anim');

            const nextFlightIn = Math.random() * 15000 + 12000;
            setTimeout(triggerUFO, nextFlightIn);
        }
        // Start a bit later to ensure image loads
        window.addEventListener('load', () => {
             setTimeout(triggerUFO, 3000);
        });
       

        // --- 6. Falling Stars Logic ---
        function createFallingStar() {
            if(isMayaMode || reducedMotion.matches) {
                setTimeout(createFallingStar, 5000);
                return;
            }

            const star = document.createElement('div');
            star.classList.add('falling-star');
            const length = Math.random() * 100 + 100;
            star.style.width = length + 'px';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 50 - 20 + 'vh'; 
            const duration = Math.random() * 1 + 1;
            star.style.animation = `shoot ${duration}s ease-out forwards`;
            document.body.appendChild(star);
            setTimeout(() => { star.remove(); }, duration * 1000);
            
            const nextStarTime = Math.random() * 4000 + 2000;
            setTimeout(createFallingStar, nextStarTime);
        }
        createFallingStar();

        // --- 7. Disable Right Click ---
        document.addEventListener('contextmenu', (e) => { e.preventDefault(); });
        
        // --- 8. MAYA MODE (switched on by the Telugu toggle) ---
        // Telugu: saffron theme + Telugu matrix rain, space layers hidden.
        // English: back to the space theme.
        // --- TELUGU MATRIX RAIN LOGIC ---
        const mCtx = matrixCanvas.getContext('2d');
        
        // Telugu script: vowels, consonants and Telugu digits
        const letters = Array.from('అఆఇఈఉఊఋఎఏఐఒఓఔకఖగఘఙచఛజఝఞటఠడఢణతథదధనపఫబభమయరలవశషసహళఱ౦౧౨౩౪౫౬౭౮౯');
        const fontSize = 18; 
        const colWidth = 24; // Telugu letters are wider than Latin, so space the columns out
        let columns;
        let drops = [];

        function initMatrix() {
            columns = matrixCanvas.width / colWidth;
            drops = [];
            for(let x = 0; x < columns; x++) drops[x] = 1;
        }

        let matrixRunning = false;

        function drawMatrix() {
            if(!isMayaMode || reducedMotion.matches) { matrixRunning = false; return; }
            matrixRunning = true;

            mCtx.fillStyle = 'rgba(0, 0, 0, 0.05)'; 
            mCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);

            // Saffron/Orange Text for Hanuman Theme
            mCtx.fillStyle = '#FF9933'; 
            mCtx.font = fontSize + 'px monospace';

            for(let i = 0; i < drops.length; i++) {
                const text = letters[Math.floor(Math.random() * letters.length)];
                mCtx.fillText(text, i * colWidth, drops[i] * fontSize);

                if(drops[i] * fontSize > matrixCanvas.height && Math.random() > 0.975)
                    drops[i] = 0;
                drops[i]++;
            }
            requestAnimationFrame(drawMatrix);
        }

        function enterMayaMode() {
            if(isMayaMode) return; 
            isMayaMode = true;

            // 1. Visual Changes - Saffron Theme
            root.style.setProperty('--neon-color', '#FF9933'); 
            currentTrailColor = '#FF9933';
            
            // 2. Hide Space Elements & Hanuman Image
            document.getElementById('starsLayer').style.opacity = '0';
            document.getElementById('nebulaLayer').style.opacity = '0';
            ufo.style.opacity = '0'; 
            document.querySelectorAll('.falling-star').forEach(el => el.remove());

            // 3. Show Matrix Layer (skipped for people who prefer reduced motion)
            initMatrix();
            matrixCanvas.style.opacity = '1';
            if (!matrixRunning) drawMatrix();

            // 4. Flash Effect (no flashing for reduced motion)
            if (!reducedMotion.matches) {
                document.body.style.backgroundColor = '#2a1200'; // Dark Saffron Flash
                setTimeout(() => {
                    document.body.style.backgroundColor = '';
                }, 200);
            }
        }

        function exitMayaMode() {
            if(!isMayaMode) return;
            isMayaMode = false; // drawMatrix stops on its next frame

            root.style.setProperty('--neon-color', '#0ef');
            currentTrailColor = '#0ef';

            document.getElementById('starsLayer').style.opacity = '';
            document.getElementById('nebulaLayer').style.opacity = '';
            ufo.style.opacity = '';

            // Fade the rain out (2s CSS transition), then wipe it
            matrixCanvas.style.opacity = '0';
            setTimeout(() => {
                if (!isMayaMode) mCtx.clearRect(0, 0, matrixCanvas.width, matrixCanvas.height);
            }, 2000);
        }

    </script>

        const sky = document.getElementById('nakSky');
        const tip = document.createElement('div');
        tip.className = 'nak-tip';
        tip.hidden = true;
        tip.setAttribute('aria-hidden', 'true'); // buttons carry their own labels
        let todayNak = -1, openNak = -1, focusNak = 0;
        const buttons = [];

        // Project each asterism into a small box (east to the left, as in the sky)
        function shape(stars, size) {
            const ra0 = stars.reduce((s, st) => s + st[0], 0) / stars.length;
            const de0 = stars.reduce((s, st) => s + st[1], 0) / stars.length;
            const c = Math.cos(de0 * Math.PI / 180);
            const pts = stars.map(st => [-(st[0] - ra0) * 15 * c, -(st[1] - de0), st[2]]);
            const span = Math.max(0.0001, ...pts.map(p => Math.max(Math.abs(p[0]), Math.abs(p[1]))));
            const k = (size / 2 - 8) / span;
            return pts.map(p => [size / 2 + p[0] * k, size / 2 + p[1] * k, p[2]]);
        }

        function buildSky() {
            const size = Math.round(Math.max(40, Math.min(96, window.innerWidth / 9, window.innerHeight / 7)));
            NAKSHATRAS.forEach((n, idx) => {
                const [te, en, desc, stars, lines] = n;
                const pts = shape(stars, size);
                let svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true" focusable="false">`;
                if (stars.length === 1) svg += `<circle class="ring" cx="${size / 2}" cy="${size / 2}" r="${size / 2 - 14}"/>`;
                svg += '<g class="lines">' + lines.map(([a, b]) =>
                    `<line x1="${pts[a][0].toFixed(1)}" y1="${pts[a][1].toFixed(1)}" x2="${pts[b][0].toFixed(1)}" y2="${pts[b][1].toFixed(1)}"/>`).join('') + '</g>';
                svg += pts.map(p => `<circle class="star" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${Math.max(1.3, 3.6 - 0.5 * p[2]).toFixed(1)}"/>`).join('');
                svg += '</svg>';
                let b = buttons[idx];
                if (!b) {
                    b = document.createElement('button');
                    b.type = 'button';
                    b.className = 'nak';
                    b.tabIndex = idx === 0 ? 0 : -1;
                    b.addEventListener('mouseenter', () => showTip(idx));
                    b.addEventListener('mouseleave', () => { if (openNak !== idx) hideTip(); });
                    b.addEventListener('focus', () => { focusNak = idx; showTip(idx); });
                    b.addEventListener('blur', () => { if (openNak !== idx) hideTip(); });
                    b.addEventListener('click', () => {
                        if (openNak === idx) { openNak = -1; b.classList.remove('is-open'); hideTip(); }
                        else { setOpen(idx); showTip(idx); }
                    });
                    buttons[idx] = b;
                    sky.appendChild(b);
                }
                b.innerHTML = svg;
                b.setAttribute('aria-label', `${en} (${te}), nakshatra ${idx + 1} of 27: ${desc}${idx === todayNak ? '. The Moon is here today.' : ''}`);
            });
            sky.appendChild(tip);
            layoutSky(size);
        }

        // One screen: Ashwini..Chitra (1-14) in a zig-zag above the name,
        // Swati..Revati (15-27) below it, so they read in order like a path.
        function layoutSky(size) {
            const W = window.innerWidth, H = window.innerHeight;
            const ticker = document.querySelector('.ticker-wrap').getBoundingClientRect();
            const icons = document.querySelector('.social-icons-container').getBoundingClientRect();
            const footer = document.querySelector('.footer-container').getBoundingClientRect();
            const badge = document.getElementById('panch').getBoundingClientRect();
            const bands = [
                [badge.bottom + 12, ticker.top - 4, 14],
                [icons.bottom + 12, footer.top - 4, 13]
            ];
            let k = 0;
            bands.forEach(([top, bottom, count]) => {
                const cols = Math.ceil(count / 2);
                const colW = (W - 32) / cols;
                const span = Math.max(0, bottom - top - size);
                for (let n = 0; n < count; n++, k++) {
                    const col = Math.floor(n / 2), row = n % 2;
                    const jitter = ((k * 7919) % 100) / 100 - 0.5; // fixed pseudo-random
                    const x = 16 + colW * (col + (row ? 0.75 : 0.25)) - size / 2 + jitter * colW * 0.2;
                    const y = top + (row ? span : 0) + jitter * Math.min(20, span * 0.15);
                    buttons[k].style.left = Math.round(Math.max(8, Math.min(W - size - 8, x))) + 'px';
                    buttons[k].style.top = Math.round(Math.max(8, y)) + 'px';
                }
            });
        }

        function setOpen(idx) {
            buttons.forEach(b => b.classList.remove('is-open'));
            openNak = idx;
            if (idx >= 0) buttons[idx].classList.add('is-open');
        }

        function showTip(idx) {
            const [te, en, desc] = NAKSHATRAS[idx];
            const b = buttons[idx];
            tip.innerHTML =
                `<span class="num">${idx + 1} / 27</span>` +
                `<span class="te" lang="te">${te}</span>` +
                `<span class="en">${en}</span>${desc}` +

            tip.hidden = false;
            const bx = b.offsetLeft, by = b.offsetTop, bs = b.offsetWidth;
            const W = document.documentElement.clientWidth;
            let x = bx + bs + 8;
            if (x + tip.offsetWidth > W - 12) x = bx - tip.offsetWidth - 8;
            if (x < 12) x = Math.max(12, Math.min(W - tip.offsetWidth - 12, bx));
            tip.style.left = x + 'px';
            const H = window.innerHeight;
            tip.style.top = Math.max(8, Math.min(H - tip.offsetHeight - 8, by + bs / 2 - tip.offsetHeight / 2)) + 'px';
        }
        function hideTip() { tip.hidden = true; }

        // One tab stop for the whole sky; arrows move, Escape closes

            if (e.key === 'Escape') { setOpen(-1); hideTip(); return; }
            if (!(e.key in keys)) return;
            e.preventDefault();
            const next = Math.max(0, Math.min(26, focusNak + keys[e.key]));
            buttons[focusNak].tabIndex = -1;
            buttons[next].tabIndex = 0;
            buttons[next].focus();
        });

        function focusToday() {

        /* ============ 2. PANCHANGAM ============ */
        // Sun and Moon longitudes from Meeus, Astronomical Algorithms
        // (ch. 25 and 47). Checked against astronomy-engine: within 0.01°,
        // which puts tithi end times within about a minute.
        const RAD = Math.PI / 180;
        const norm = a => ((a % 360) + 360) % 360;
        // [D, M, M', F, coefficient × 1e-6 degrees]
        const MOON = [
            [0,0,1,0,6288774],[2,0,-1,0,1274027],[2,0,0,0,658314],[0,0,2,0,213618],[0,1,0,0,-185116],
            [0,0,0,2,-114332],[2,0,-2,0,58793],[2,-1,-1,0,57066],[2,0,1,0,53322],[2,-1,0,0,45758],
            [0,1,-1,0,-40923],[1,0,0,0,-34720],[0,1,1,0,-30383],[2,0,0,-2,15327],[0,0,1,2,-12528],
            [0,0,1,-2,10980],[4,0,-1,0,10675],[0,0,3,0,10034],[4,0,-2,0,8548],[2,1,-1,0,-7888],

            [4,0,0,0,3861],[2,0,-3,0,3665],[0,1,-2,0,-2689],[2,0,-1,2,-2602],[2,-1,-2,0,2390],
            [1,0,1,0,-2348],[2,-2,0,0,2236],[0,1,2,0,-2120],[0,2,0,0,-2069],[2,-2,-1,0,2048],
            [2,0,1,-2,-1773],[2,0,0,2,-1595],[4,-1,-1,0,1215],[0,0,2,2,-1110],[3,0,-1,0,-892],
            [2,1,1,0,-810],[4,-1,-2,0,759],[0,2,-1,0,-713],[2,2,-1,0,-700],[2,1,-2,0,691],
            [2,-1,0,-2,596],[4,0,1,0,549],[0,0,4,0,537],[4,-1,0,0,520],[1,0,-2,0,-487],
            [2,1,0,-2,-399],[0,0,2,-2,-381],[1,1,1,0,351],[3,0,-2,0,-340],[4,0,-3,0,330],
            [2,-1,2,0,327],[0,2,1,0,-323],[1,1,-1,0,299],[2,0,3,0,294]];
        // Julian centuries (TT) since J2000; ΔT ≈ 69 s for the 2020s
        const jc = d => (d.getTime() / 86400000 + 2440587.5 + 69 / 86400 - 2451545) / 36525;
        function sunLon(T) {
            const L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
            const M = (357.52911 + 35999.05029 * T - 0.0001537 * T * T) * RAD;
            const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(M)
                + (0.019993 - 0.000101 * T) * Math.sin(2 * M) + 0.000289 * Math.sin(3 * M);
            return norm(L0 + C - 0.00569 - 0.00478 * Math.sin((125.04 - 1934.136 * T) * RAD));
        }
        function moonLon(T) {
            const Lp = 218.3164477 + 481267.88123421 * T - 0.0015786 * T * T + T * T * T / 538841;
            const D = (297.8501921 + 445267.1114034 * T - 0.0018819 * T * T + T * T * T / 545868) * RAD;
            const M = (357.5291092 + 35999.0502909 * T - 0.0001536 * T * T) * RAD;
            const Mp = (134.9633964 + 477198.8675055 * T + 0.0087414 * T * T + T * T * T / 69699) * RAD;
            const F = (93.2720950 + 483202.0175233 * T - 0.0036539 * T * T) * RAD;
            const E = 1 - 0.002516 * T - 0.0000074 * T * T;
            let s = 0;
            for (const [d, m, mp, f, c] of MOON) s += c * (m === 0 ? 1 : Math.abs(m) === 1 ? E : E * E) * Math.sin(d * D + m * M + mp * Mp + f * F);
            s += 3958 * Math.sin((119.75 + 131.849 * T) * RAD) + 1962 * Math.sin(Lp * RAD - F) + 318 * Math.sin((53.09 + 479264.290 * T) * RAD);
            return norm(Lp + s / 1e6 - 0.00478 * Math.sin((125.04 - 1934.136 * T) * RAD));
        }
        const ayanamsa = T => 23.853 + 1.3969 * T; // Lahiri
        const elong = d => { const T = jc(d); return norm(moonLon(T) - sunLon(T)); };
        const sidSun = d => { const T = jc(d); return norm(sunLon(T) - ayanamsa(T)); };
        const sidMoon = d => { const T = jc(d); return norm(moonLon(T) - ayanamsa(T)); };

        // When does fn (an angle that keeps increasing) next/last reach target?
        function cross(fn, target, from, dir, rate) {
            const gap = norm(dir > 0 ? target - fn(from) : fn(from) - target);
            const guess = from.getTime() + dir * gap / rate * 86400000;
            let a = guess - 2 * 86400000, b = guess + 2 * 86400000;
            const g = t => { const x = norm(fn(new Date(t)) - target); return x > 180 ? x - 360 : x; };
            for (let k = 0; k < 40; k++) { const m = (a + b) / 2; if (g(m) < 0) a = m; else b = m; }
            return new Date(b);
        }

        function panchangam(now) {
            const e = elong(now);
            const tithi = Math.floor(e / 12);
            const nak = Math.floor(sidMoon(now) / (360 / 27));
            const nm0 = cross(elong, 0, now, -1, 12.19);
            const nm1 = cross(elong, 0, new Date(nm0.getTime() + 86400000), 1, 12.19);
            const r0 = Math.floor(sidSun(nm0) / 30), r1 = Math.floor(sidSun(nm1) / 30);
            const month = (r0 + 1) % 12; // Sun in Meena at the new moon -> Chaitra
            // Telugu year turns at Ugadi (Chaitra Shukla Padyami)
            const y = now.getFullYear() - ((now.getMonth() < 6 && month >= 8) ? 1 : 0);
            return {
                e, tithi, nak, month, adhika: r0 === r1, year: ((y - 1987) % 60 + 60) % 60,
                tithiEnd: cross(elong, ((tithi + 1) * 12) % 360, now, 1, 12.19),
                nakEnd: cross(sidMoon, ((nak + 1) * 360 / 27) % 360, now, 1, 13.18)
            };
        }

                labels: ['తిథి', 'నక్షత్రం', 'మాసం', 'సంవత్సరం', 'వారం'],
                title: 'నేటి పంచాంగం', sky: 'ఆకాశంలో చూపించు',
                note: 'మీ బ్రౌజర్‌లోనే ఈ క్షణానికి లెక్కించబడింది (లాహిరి అయనాంశ, అమాంత మాసం). సమయాలు మీ టైమ్ జోన్‌లో.'
            },
            en: {
                tithi: ['Padyami','Vidiya','Tadiya','Chavithi','Panchami','Shashti','Saptami','Ashtami','Navami','Dashami','Ekadashi','Dwadashi','Trayodashi','Chaturdashi'],
                full: 'Pournami', newm: 'Amavasya', paksha: ['Shukla', 'Bahula'],
                month: ['Chaitra','Vaishakha','Jyeshtha','Ashadha','Shravana','Bhadrapada','Ashwayuja','Kartika','Margashira','Pushya','Magha','Phalguna'],
                adhika: 'Adhika ',
                day: ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],
                year: ['Prabhava','Vibhava','Shukla','Pramoduta','Prajotpatti','Angirasa','Shrimukha','Bhava','Yuva','Dhatu','Ishvara','Bahudhanya','Pramathi','Vikrama','Vrisha','Chitrabhanu','Svabhanu','Tarana','Parthiva','Vyaya','Sarvajit','Sarvadhari','Virodhi','Vikriti','Khara','Nandana','Vijaya','Jaya','Manmatha','Durmukhi','Hevilambi','Vilambi','Vikari','Sharvari','Plava','Shubhakrit','Shobhakrit','Krodhi','Vishvavasu','Parabhava','Plavanga','Kilaka','Saumya','Sadharana','Virodhikrit','Paridhavi','Pramadicha','Ananda','Rakshasa','Nala','Pingala','Kalayukti','Siddharthi','Raudri','Durmati','Dundubhi','Rudhirodgari','Raktakshi','Krodhana','Akshaya'],
                yearSuffix: ' year', until: 'until',
                labels: ['Tithi', 'Nakshatra', 'Month', 'Year', 'Day'],
                title: "Today's panchangam", sky: 'Show it in the sky',
                note: 'Worked out in your browser for this moment (Lahiri ayanamsa, amanta months). Times are in your time zone.'
            }
        };

        // Moon disc lit by elongation e (0 = new, 180 = full)
        function moonIcon(e, r) {
            const c = Math.cos(e * RAD), waxing = e < 180, rx = Math.abs(c) * r;
            const limb = waxing ? 1 : 0;
            const term = c > 0 ? (waxing ? 0 : 1) : (waxing ? 1 : 0);
            const d = `M ${r} 0 A ${r} ${r} 0 0 ${limb} ${r} ${2 * r} A ${rx} ${r} 0 0 ${term} ${r} 0 Z`;
            return `<svg width="${2 * r}" height="${2 * r}" viewBox="0 0 ${2 * r} ${2 * r}"><circle cx="${r}" cy="${r}" r="${r - 0.5}" fill="#2a2a38" stroke="rgba(255,153,51,.5)"/><path d="${d}" fill="#ffd9a8"/></svg>`;
        }

        const badge = document.getElementById('panchBadge');
        const panel = document.getElementById('panchPanel');
        let P = null;

        function fmtTime(d) {
            const opts = { weekday: 'short', hour: 'numeric', minute: '2-digit' };
            return d.toLocaleString(lang === 'te' ? 'te-IN' : undefined, opts);
        }

        // "until Sat 10:27 PM" / "శని 10:27 PM వరకు"
        function untilText(d) {
            return lang === 'te' ? `${fmtTime(d)} ${T.te.until}` : `${T.en.until} ${fmtTime(d)}`;
        }

        function renderPanch() {
            const now = new Date();
            P = panchangam(now);
            const L = T[lang];
            const inPaksha = P.tithi % 15;
            const pakshaName = L.paksha[P.tithi < 15 ? 0 : 1];
            const tithiName = P.tithi === 14 ? L.full : P.tithi === 29 ? L.newm : L.tithi[inPaksha];
            const monthName = (P.adhika ? L.adhika : '') + L.month[P.month];
            const line1 = `${monthName} ${pakshaName} ${tithiName}`;
            const nakName = lang === 'te' ? NAKSHATRAS[P.nak][0] : NAKSHATRAS[P.nak][1];

            document.getElementById('panchMoon').innerHTML = moonIcon(P.e, 13);
            document.getElementById('panchLine1').textContent = line1;
            document.getElementById('panchLine2').textContent = `${L.day[now.getDay()]} · ${L.year[P.year]}${lang === 'te' ? '' : L.yearSuffix}`;
            badge.lang = lang;
            badge.setAttribute('aria-label', `${L.title}: ${line1}`);

            panel.lang = lang;
            panel.innerHTML =
                `<h2 id="panchTitle">${L.title}</h2><dl>` +
                `<dt>${L.labels[0]}</dt><dd>${pakshaName} ${tithiName}<small>${untilText(P.tithiEnd)}</small></dd>` +
                `<dt>${L.labels[1]}</dt><dd>${nakName}<small>${untilText(P.nakEnd)}</small></dd>` +
                `<dt>${L.labels[2]}</dt><dd>${monthName}</dd>` +
                `<dt>${L.labels[3]}</dt><dd>${L.year[P.year]}${L.yearSuffix}</dd>` +
                `<dt>${L.labels[4]}</dt><dd>${L.day[now.getDay()]}</dd></dl>` +
                `<button type="button" id="panchSky">${L.sky}</button>` +
                `<p class="panch-note">${L.note}</p>`;
            document.getElementById('panchSky').addEventListener('click', () => { closePanel(); focusToday(); });

            if (todayNak !== P.nak) {
                if (todayNak >= 0) buttons[todayNak].classList.remove('is-today');
                todayNak = P.nak;
                buttons[todayNak].classList.add('is-today');
                buildSky(); // refresh labels
            }
        }

        function openPanel() { panel.hidden = false; badge.setAttribute('aria-expanded', 'true'); }
        function closePanel() { panel.hidden = true; badge.setAttribute('aria-expanded', 'false'); }
        badge.addEventListener('click', () => panel.hidden ? openPanel() : closePanel());
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !panel.hidden) { closePanel(); badge.focus(); }
        });
        document.addEventListener('click', (e) => {
            if (!panel.hidden && !e.target.closest('#panch')) closePanel();
        });

        /* ============ 3. MANTRA EASTER EGG ============ */
        // Typing "jai hanuman" anywhere (spaces optional) sets off a burst
        // of saffron light. Reduced motion gets a soft glow instead.
        const MANTRA = 'jaihanuman';
        let typed = '', burstAt = 0;
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1) return;
            if (e.key === ' ') return; // spaces don't break the mantra
            typed = (typed + e.key.toLowerCase()).slice(-MANTRA.length);
            if (typed === MANTRA && Date.now() - burstAt > 2500) {
                burstAt = Date.now();
                typed = '';
                mantraBurst();
            }
        });

        function mantraBurst() {
            const layer = document.createElement('div');
            layer.className = 'mantra-burst';
            layer.setAttribute('aria-hidden', 'true');
            let html = '<div class="mantra-glow"></div>';
            if (!reduce.matches) {
                const reach = Math.max(window.innerWidth, window.innerHeight) * 0.6;
                for (let k = 0; k < 28; k++) {
                    const ang = k * (360 / 28) + ((k * 37) % 9);
                    const dist = reach * (0.45 + ((k * 53) % 50) / 100);
                    html += `<span class="mantra-spark" style="--a:${ang}deg;--d:${Math.round(dist)}px;animation-delay:${(k % 4) * 0.05}s"></span>`;
                }
            }
            html += '<div class="mantra-words" lang="te">జై హనుమాన్</div>';
            layer.innerHTML = html;
            document.body.appendChild(layer);
            document.getElementById('mantraLive').textContent = 'జై హనుమాన్! Jai Hanuman!';
            setTimeout(() => {
                layer.remove();
                document.getElementById('mantraLive').textContent = '';
            }, 2600);
        }

        /* ============ start ============ */
        buildSky();
        renderPanch();
        setInterval(() => { if (P && Date.now() >= Math.min(P.tithiEnd, P.nakEnd)) renderPanch(); }, 60000);
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(buildSky, 150);
        });
        // Fonts change the name's height, so lay out again once they're in
        window.addEventListener('load', () => layoutSky(buttons[0].offsetWidth));

        window.Chedalla = {
            setLang(l) { lang = l; renderPanch(); if (!tip.hidden && openNak >= 0) showTip(openNak); },
            panchangam,
            mantraBurst
        };
    })();
    </script>
</body>
